name: Update GitHub Profile README

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-profile.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Render dynamic placeholders
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const readmePath = path.join(process.env.GITHUB_WORKSPACE, 'README.md');
            const original = fs.readFileSync(readmePath, 'utf8');
            const rendered = original.replace(/USERNAME/g, context.repo.owner);

            if (rendered !== original) {
              fs.writeFileSync(readmePath, rendered);
              console.log('README placeholders rendered.');
            } else {
              console.log('No placeholders to render.');
            }

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add README.md
            git commit -m "docs: auto-update profile README"
            git push
            echo "Changes committed and pushed"
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
